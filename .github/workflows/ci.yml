name: CI

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.classify.outputs.backend }}
      admin_web: ${{ steps.classify.outputs.admin_web }}
      agent_mobile: ${{ steps.classify.outputs.agent_mobile }}
      customer_mobile: ${{ steps.classify.outputs.customer_mobile }}
      full_regression: ${{ steps.classify.outputs.full_regression }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test conservative change classification
        run: node --test test/ci-change-classification.test.cjs
      - name: Classify changed paths
        id: classify
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          FULL_REGRESSION: ${{ github.event_name == 'release' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') || github.event.before == '0000000000000000000000000000000000000000' }}
        run: node scripts/classify-ci-changes.cjs --base "$BASE_SHA" --head "$HEAD_SHA" --full "$FULL_REGRESSION" --output "$GITHUB_OUTPUT"

  backend:
    name: Backend (lint, format, build, unit tests)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The consolidated evidence matrix verifies commit ancestry against HEAD.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
      - name: Local preflight safety tests (mocked; no database)
        run: node --test test/local-preflight.test.cjs
      - name: Run unit tests with outbound network blocked
        env:
          NODE_OPTIONS: --require ./test/support/mission-25c-network-guard.cjs
          NOTIFICATION_WORKER_ENABLED: 'false'
          CASH_TO_CASH_EXPIRY_WORKER_ENABLED: 'false'
        run: npm test

  # Real PostgreSQL integration gate. The service container is a genuine PostgreSQL 16 server
  # (the major version verified against 16.14); the suites under jest.integration.config.js run
  # against it directly, so serializable retries, row locking, migration chains and the ledger
  # balance triggers are all exercised on the database engine rather than on a test double.
  # This job must never be removed, made optional, or allowed to fail without failing the run.
  backend-postgres:
    name: Backend (real PostgreSQL integration)
    needs: [changes, backend]
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: monienaija
          POSTGRES_PASSWORD: monienaija-ci-password
          POSTGRES_DB: monienaija_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U monienaija -d monienaija_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      NODE_ENV: test
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_NAME: monienaija_ci
      DB_USER: monienaija
      DB_PASSWORD: monienaija-ci-password
      DB_ADMIN_NAME: postgres
      PG_TEST_CONFIRM_DISPOSABLE_CLUSTER: 'yes'
      DB_SSL: 'false'
      NOTIFICATION_WORKER_ENABLED: 'false'
      CASH_TO_CASH_EXPIRY_WORKER_ENABLED: 'false'
      # Integration suites use wholesale table truncation for per-case fixture isolation.
      # Keep the periodic KYC evaluator out of that database; worker behavior is covered by
      # dedicated tests that opt in explicitly.
      KYC_TIER_WORKER_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Apply migrations to the CI database
        run: |
          npm run migration:run:compiled
          npm run migration:show:compiled
      # Use the repository's public test placeholders, including the complete workforce role
      # catalogue required by AppModule integration tests. Existing CI DB env takes precedence.
      - name: Prepare isolated PostgreSQL test configuration
        run: node scripts/prepare-pg-test-env.js --create-if-missing
      - name: Run the real-PostgreSQL integration suites
        id: pg-suites
        env:
          PG_TEST_SUMMARY_PATH: ${{ runner.temp }}/pg-summary.json
          NODE_OPTIONS: --require ./test/support/mission-25c-network-guard.cjs
        run: npm run test:pg

      - name: Prepare Transaction History browser acceptance
        run: |
          npm ci --prefix apps/admin-web
          npx playwright install --with-deps chromium
          echo "HISTORY_MATRIX_CHROMIUM_PATH=$(node -e "console.log(require('playwright').chromium.executablePath())")" >> "$GITHUB_ENV"
          ADMIN_WEB_DEV_PROXY_TARGET=http://127.0.0.1:3099 npm run dev --prefix apps/admin-web -- --host 0.0.0.0 > "$RUNNER_TEMP/history-vite.log" 2>&1 &
      - name: Five-product real workforce browser acceptance
        env:
          PG_TEST_RUN_ID: historybrowser
          HISTORY_MATRIX_BROWSER: 'yes'
          HISTORY_MATRIX_OUT: data/validation/transaction-history-browser-matrix
        run: npx jest --config jest.integration.config.js --runInBand test/transaction-history-browser-matrix.integration.spec.ts
      - name: Attach exact-checkout browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: transaction-history-browser-${{ github.sha }}
          path: data/validation/transaction-history-browser-matrix/
          if-no-files-found: warn

      # Jest annotations cover individual assertions, but not a suite that cannot start,
      # a child killed by a signal, or a failure in global teardown. Keep the gate mandatory.
      - name: Identify failed PostgreSQL batches
        if: failure() && steps.pg-suites.outcome == 'failure'
        env:
          PG_TEST_SUMMARY_PATH: ${{ runner.temp }}/pg-summary.json
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = process.env.PG_TEST_SUMMARY_PATH;
          if (!fs.existsSync(path)) throw new Error('PostgreSQL runner exited before writing its summary');
          const s = JSON.parse(fs.readFileSync(path, 'utf8'));
          console.log(`::error::PostgreSQL: ${s.suitesFailed} failed, ${s.filesWithoutResult.length} missing of ${s.filesDiscovered}; ${s.memoryFailures} memory failures, ${s.timeouts} timeouts, ${s.unexplainedCrashes} crashes. Failed batch files: ${s.failingFiles.join(', ')}`);
          NODE

  # The repository ships a production Dockerfile with a multi-stage build, a non-root user and a healthcheck,
  # and nothing ever built it. A Dockerfile that no pipeline compiles can rot silently — a dependency bump, a
  # changed COPY path or a dropped file is only discovered at release time, which is the worst moment.
  #
  # Scope: this job proves the image *builds*. It does not run the image, does not start the stack, and does not
  # execute `docker compose`. Those are separate claims, and none of them is made here.
  backend-container-build:
    name: Backend (container image builds)
    needs: [changes, backend]
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the production image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: false
          tags: monienaija-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # A second PostgreSQL gate, for the suites the first one structurally cannot run.
  #
  # `jest.integration.config.js` matches `*.integration.spec.ts`. The eleven `*.isolated-pg.test.ts` suites do
  # not match that pattern by design: they own a disposable socket-only cluster of their own and assert on its
  # provenance. They were run by `npm run test:pg:isolated-kyc`, and nothing invoked that script — so migration
  # chains, governance singletons, KYC registration flows and governed ledger reversal were guarded by tests
  # that never ran on a push.
  #
  # Installing postgresql-client provides the `initdb`/`pg_ctl` binaries the script needs; the script creates
  # its own cluster in a temp directory and refuses to touch anything it did not create.
  backend-postgres-isolated:
    name: Backend (isolated PostgreSQL suites)
    needs: [changes, backend]
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install PostgreSQL server binaries for the disposable cluster
        run: sudo apt-get update && sudo apt-get install -y postgresql
      - name: Run the isolated PostgreSQL suites against a disposable cluster
        env:
          NODE_OPTIONS: --require ./test/support/mission-25c-network-guard.cjs
          NOTIFICATION_WORKER_ENABLED: 'false'
          CASH_TO_CASH_EXPIRY_WORKER_ENABLED: 'false'
        run: npm run test:pg:isolated-kyc:ci

  admin-web:
    name: Admin Web (types, tests, build)
    needs: changes
    if: needs.changes.outputs.admin_web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/admin-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/admin-web/package-lock.json
      - run: npm ci
      - run: npm run ts:check
      - run: npm test
      - run: npm run build

  # Both mobile apps are gated. `apps/agent-mobile` was absent from this workflow entirely, so its 323 unit
  # tests and its type check never ran on any push or pull request. A suite that CI does not execute is not a
  # gate, whatever its coverage says.
  agent-mobile:
    name: Agent Mobile (types, tests)
    needs: changes
    if: needs.changes.outputs.agent_mobile == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/agent-mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/agent-mobile/package-lock.json
      - run: npm ci
      - run: npm run ts:check
      - run: npm test

  customer-mobile:
    name: Customer Mobile (types, tests)
    needs: changes
    if: needs.changes.outputs.customer_mobile == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/customer-mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/customer-mobile/package-lock.json
      - run: npm ci
      - run: npm run ts:check
      - run: npm test
