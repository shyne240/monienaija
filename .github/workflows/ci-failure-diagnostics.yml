name: Temporary CI failure diagnostics

on:
  push:
    branches:
      - arena/92fd33dd-monienaija
    paths:
      - .github/workflows/ci-failure-diagnostics.yml

permissions:
  actions: read
  contents: read

jobs:
  inspect:
    name: Classify historical PostgreSQL failures safely
    runs-on: ubuntu-latest
    steps:
      - name: Retrieve logs and emit allowlisted aggregate diagnostics
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import collections
          import json
          import os
          import re
          import subprocess
          import sys

          repo = os.environ['GITHUB_REPOSITORY']
          jobs = [125557143419, 125922626764]
          ansi = re.compile(r'\x1b\[[0-9;?]*[ -/]*[@-~]')
          timestamp = re.compile(r'^\d{4}-\d\d-\d\dT\S+\s+')
          markers = {
              'workforce role unavailable': r'SUPER_ADMIN role is disabled or undefined in configuration',
              'workforce authentication disabled': r'Workforce authentication disabled',
              'serialization failure': r'could not serialize access|SQLSTATE.?40001',
              'deadlock detected': r'deadlock detected',
              'hook timeout': r'Exceeded timeout of \d+ ms for a hook',
              'test timeout': r'Exceeded timeout of \d+ ms for a test',
              'outbound guard': r'M25C_TEST_(?:OUTBOUND_NETWORK|DNS|FETCH)_BLOCKED',
              'typescript compilation': r'error TS\d+',
          }
          class_pattern = re.compile(r'^\s*([A-Za-z][A-Za-z0-9]*(?:Exception|Error))(?::|\s*$)')
          path_pattern = re.compile(r'\b((?:src|test)/[\w./-]+\.ts):(\d+)(?::\d+)?')
          safe_location = re.compile(r'^(?:src|test)/[\w./-]+\.ts:\d+$')

          for job in jobs:
              args = ['curl', '--fail', '--silent', '--show-error', '--location', '--max-time', '90',
                      '--config', '-', f'https://api.github.com/repos/{repo}/actions/jobs/{job}/logs']
              config = f'header = "Authorization: Bearer {os.environ["GH_TOKEN"]}"\n'.encode()
              proc = subprocess.run(args, input=config, stdout=subprocess.PIPE, stderr=subprocess.PIPE)
              if proc.returncode:
                  print(f'::error::Failed to retrieve historical job {job}; response withheld.', flush=True)
                  sys.exit(1)
              raw = ansi.sub('', proc.stdout.decode('utf-8', errors='replace'))
              lines = [timestamp.sub('', line) for line in raw.splitlines()]
              starts = [i for i, line in enumerate(lines)
                        if re.match(r'^\s*●\s+', line) and not re.match(r'^\s*●\s+Console\s*$', line)]
              categories = collections.Counter()
              exception_classes = collections.Counter()
              locations = collections.Counter()
              for n, start in enumerate(starts):
                  end = min(starts[n + 1] if n + 1 < len(starts) else len(lines), start + 150)
                  block = '\n'.join(lines[start:end])
                  for name, pattern in markers.items():
                      if re.search(pattern, block, re.I):
                          categories[name] += 1
                  for line in lines[start:end]:
                      found = class_pattern.match(line)
                      if found:
                          exception_classes[found.group(1)] += 1
                          break
                  for loc in path_pattern.findall(block):
                      location = f'{loc[0]}:{loc[1]}'
                      if safe_location.match(location):
                          locations[location] += 1
              output = {
                  'log_bytes': len(proc.stdout),
                  'failed_case_blocks': len(starts),
                  'case_categories': dict(categories),
                  'global_known_marker_counts': {name: len(re.findall(pattern, raw, re.I))
                                                 for name, pattern in markers.items()
                                                 if re.search(pattern, raw, re.I)},
                  'exception_classes': dict(exception_classes.most_common(8)),
                  'common_source_locations': [loc for loc, _ in locations.most_common(10)],
              }
              message = json.dumps(output, separators=(',', ':')).replace('%', '%25')
              print(f'::notice title=Historical PG job {job}::{message}', flush=True)
          PY
