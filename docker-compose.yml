services:
  postgres:
    image: postgres:16-alpine
    container_name: monienaija-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-monienaija}
      POSTGRES_USER: ${DB_USER:-monienaija}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me-local-only}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

volumes:
  postgres-data:
