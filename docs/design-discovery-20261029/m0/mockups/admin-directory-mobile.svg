<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1150" viewBox="0 0 390 1150" role="img" aria-labelledby="title desc">
  <title id="title">Grounded Clarity concept: Admin Customer Directory, narrow web</title>
  <desc id="desc">A nonfunctional narrow-web proposal with a menu toggle, conditional New Customer action, stacked filters, and a table that extends horizontally. All customer records and values are synthetic. No action or menu in this illustration is operational.</desc>
  <defs><clipPath id="table-viewport"><rect x="34" y="747" width="322" height="213"/></clipPath></defs>
  <rect width="390" height="1150" fill="#F5F8F6"/>
  <rect width="390" height="62" fill="#FFF3D9"/>
  <text x="16" y="25" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#8C5600">NONFUNCTIONAL CONCEPT · SYNTHETIC DATA</text>
  <text x="16" y="44" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#8C5600">NOT AN IMPLEMENTED OR APPROVED SCREEN</text>
  <rect y="62" width="390" height="64" fill="#132B25"/>
  <rect x="16" y="72" width="44" height="44" rx="8" fill="none" stroke="#FFFFFF"/>
  <path d="M28 86h20M28 94h20M28 102h20" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
  <text x="74" y="101" font-family="system-ui,sans-serif" font-size="17" font-weight="700" fill="#FFFFFF">MonieNaija</text>
  <text x="373" y="100" text-anchor="end" font-family="system-ui,sans-serif" font-size="11" fill="#EAF4EE">SYNTHETIC ROLE</text>
  <text x="18" y="161" font-family="system-ui,sans-serif" font-size="11" font-weight="700" letter-spacing="1" fill="#0B624A">CUSTOMER SERVICING</text>
  <text x="18" y="199" font-family="system-ui,sans-serif" font-size="27" font-weight="700" fill="#132B25">Customer directory</text>
  <text x="18" y="226" font-family="system-ui,sans-serif" font-size="13" fill="#52655F">Search authorized records and open a</text>
  <text x="18" y="246" font-family="system-ui,sans-serif" font-size="13" fill="#52655F">read-first Customer 360° workspace.</text>
  <rect x="18" y="268" width="160" height="46" rx="8" fill="#0B624A"/>
  <text x="98" y="297" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">New Customer</text>
  <text x="18" y="334" font-family="system-ui,sans-serif" font-size="11" fill="#52655F">Only with customer.create</text>
  <rect x="18" y="353" width="354" height="687" rx="12" fill="#FFFFFF" stroke="#D6E1DB"/>
  <text x="34" y="386" font-family="system-ui,sans-serif" font-size="16" font-weight="700" fill="#132B25">Search and results</text>
  <g font-family="system-ui,sans-serif" font-size="12" font-weight="600" fill="#132B25">
    <text x="34" y="420">Search</text><text x="34" y="506">Status</text><text x="203" y="506">Type</text><text x="34" y="592">KYC level</text><text x="203" y="592">KYC status</text>
  </g>
  <g fill="#FFFFFF" stroke="#6D817A"><rect x="34" y="430" width="322" height="44" rx="8"/><rect x="34" y="516" width="153" height="44" rx="8"/><rect x="203" y="516" width="153" height="44" rx="8"/><rect x="34" y="602" width="153" height="44" rx="8"/><rect x="203" y="602" width="153" height="44" rx="8"/></g>
  <g font-family="system-ui,sans-serif" font-size="12" fill="#52655F">
    <text x="47" y="457">Name, reference or contact</text><text x="47" y="543">All statuses  ⌄</text><text x="216" y="543">All types  ⌄</text><text x="47" y="629">All levels  ⌄</text><text x="216" y="629">All KYC statuses  ⌄</text>
  </g>
  <text x="34" y="684" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#132B25">3 customers</text>
  <text x="356" y="684" text-anchor="end" font-family="system-ui,sans-serif" font-size="12" fill="#52655F">Page 1 of 1</text>
  <text x="34" y="714" font-family="system-ui,sans-serif" font-size="11.5" font-weight="600" fill="#0B624A">← Scroll table for all fields and actions →</text>
  <rect x="34" y="733" width="322" height="227" rx="8" fill="#FFFFFF" stroke="#6D817A"/>
  <g clip-path="url(#table-viewport)" font-family="system-ui,sans-serif">
    <rect x="35" y="747" width="900" height="40" fill="#F5F8F6"/>
    <text x="46" y="772" font-size="11" font-weight="700" fill="#52655F">Customer</text><text x="211" y="772" font-size="11" font-weight="700" fill="#52655F">Reference</text><text x="340" y="772" font-size="11" font-weight="700" fill="#52655F">Type</text>
    <text x="46" y="817" font-size="12" font-weight="700" fill="#132B25">Synthetic Customer A</text><text x="211" y="817" font-size="12" fill="#132B25">mn-••••0001</text><text x="340" y="817" font-size="12" fill="#132B25">INDIVIDUAL</text>
    <line x1="35" y1="838" x2="935" y2="838" stroke="#D6E1DB"/>
    <text x="46" y="867" font-size="12" font-weight="700" fill="#132B25">Synthetic Customer B</text><text x="211" y="867" font-size="12" fill="#132B25">mn-••••0002</text><text x="340" y="867" font-size="12" fill="#132B25">BUSINESS</text>
    <line x1="35" y1="888" x2="935" y2="888" stroke="#D6E1DB"/>
    <text x="46" y="917" font-size="12" font-weight="700" fill="#132B25">Synthetic Customer C</text><text x="211" y="917" font-size="12" fill="#132B25">mn-••••0003</text><text x="340" y="917" font-size="12" fill="#132B25">INDIVIDUAL</text>
  </g>
  <rect x="45" y="943" width="116" height="5" rx="2.5" fill="#52655F"/><rect x="161" y="943" width="184" height="5" rx="2.5" fill="#D6E1DB"/>
  <rect x="34" y="976" width="94" height="44" rx="8" fill="#F5F8F6" stroke="#6D817A"/><text x="81" y="1003" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#52655F">Previous</text>
  <text x="195" y="1003" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#52655F">Page 1 of 1</text>
  <rect x="262" y="976" width="94" height="44" rx="8" fill="#F5F8F6" stroke="#6D817A"/><text x="309" y="1003" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#52655F">Next</text>
  <text x="18" y="1077" font-family="system-ui,sans-serif" font-size="12" fill="#52655F">Illustration only; scroll, menu and controls</text>
  <text x="18" y="1096" font-family="system-ui,sans-serif" font-size="12" fill="#52655F">are not functional. Accessibility is a test gate.</text>
