# MonieNaija reverse proxy: TLS termination, the single public entry point, and the routing that
# makes the admin web same-origin with the API.
#
# Two properties this file exists to guarantee:
#
#  1. **The API is never reachable without TLS.** Port 80 redirects and does nothing else. There is
#     no plaintext fallback, because a financial session token sent over port 80 has already leaked.
#  2. **The admin web and the API share an origin.** The browser calls `/api/v1/...` relative to
#     whatever host served the page, so there is no CORS allowlist to misconfigure and no API hostname
#     compiled into the bundle. A mis-built admin image cannot point at a test backend.
#
# Request limits are set here rather than only in the application: a body limit enforced after the
# proxy has buffered 100 MB has already cost the memory.

upstream backend_api {
    server backend:3000;
    keepalive 32;
}

upstream admin_web {
    server admin-web:80;
    keepalive 16;
}

# Rate limiting at the edge, in addition to the application's own per-route controls. Two layers on
# purpose: the edge protects the application from load it should never see, and the application
# enforces the limits that actually matter (per-customer, per-function), which the proxy cannot know.
limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api_zone:10m rate=60r/s;
limit_conn_zone $binary_remote_addr zone=conn_zone:10m;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    # No content. No redirect target guessing. An HTTP request is answered with a redirect to the same
    # host over TLS and nothing else.
    return 308 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # Certificates are mounted, never baked into an image. A self-signed pair is provided for local
    # acceptance only; a real deployment supplies its own and the file names do not change.
    ssl_certificate     /etc/nginx/certs/tls.crt;
    ssl_certificate_key /etc/nginx/certs/tls.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_timeout 10m;
    ssl_session_cache shared:TLS:10m;
    ssl_session_tickets off;
    ssl_stapling off;

    # Security headers. HSTS is short deliberately: a long max-age on a hostname that later needs to
    # serve plain HTTP is very hard to undo.
    add_header Strict-Transport-Security "max-age=300; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    # The application also sets a CSP; this is the stricter of the two and exists so a proxy-level
    # deployment cannot silently serve a page with no policy at all.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    client_max_body_size 12m;
    client_body_buffer_size 128k;
    client_body_timeout 30s;
    client_header_timeout 15s;
    keepalive_timeout 65s;
    send_timeout 30s;

    # Do not advertise the exact server build.
    server_tokens off;

    # Access log deliberately omits query strings and the Authorization header. Provider references
    # and filters can appear in a query string, and a proxy log is not an approved place for them.
    access_log /dev/stdout combined_no_args;
    error_log  /dev/stderr warn;

    limit_conn conn_zone 40;

    # ---- authentication endpoints: the tightest limit, because these are the credential-guessing
    # surface and a legitimate client authenticates a handful of times per hour.
    location ~ ^/api/v1/(customers|agents|workforce|support|admins)/sessions$ {
        limit_req zone=auth_zone burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://backend_api;
        include /etc/nginx/conf.d/proxy-headers.inc;
    }

    # ---- webhook ingress: no rate limit keyed on the sender address, because provider callbacks
    # arrive from shared infrastructure. Authenticity is proven by the HMAC over the raw body, which
    # is why the body is passed through untouched and buffering is disabled.
    location /api/v1/internal/banking/webhooks {
        proxy_request_buffering off;
        proxy_read_timeout 30s;
        client_max_body_size 1m;
        proxy_pass http://backend_api;
        include /etc/nginx/conf.d/proxy-headers.inc;
    }

    # ---- health: public liveness only. Readiness is authenticated and stays on the API path below.
    location = /api/v1/health {
        access_log off;
        proxy_pass http://backend_api;
        include /etc/nginx/conf.d/proxy-headers.inc;
    }

    # ---- the API proper
    location /api/ {
        limit_req zone=api_zone burst=120 nodelay;
        limit_req_status 429;
        proxy_pass http://backend_api;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        include /etc/nginx/conf.d/proxy-headers.inc;
    }

    # ---- admin web (static). Everything not under /api/ is the SPA, including client-side routes,
    # so unknown paths fall back to index.html rather than 404ing a deep link.
    location / {
        proxy_pass http://admin_web;
        include /etc/nginx/conf.d/proxy-headers.inc;
    }
}

# Named log format without the query string. Declared here so the reference above is valid.
log_format combined_no_args '$remote_addr - $remote_user [$time_local] '
                            '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                            '"$http_referer" "$http_user_agent" rt=$request_time';
